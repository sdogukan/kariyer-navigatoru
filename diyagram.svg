<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B6A66" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="800" height="470" rx="18" fill="#FBFAF7"/>

<text x="400" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#2C2C2A">Kariyer Navigatörü · nasıl çalışır</text>
<text x="400" y="62" text-anchor="middle" font-size="13" fill="#6B6A66">kimsin → ne yapıyorsun → nereye gidiyorsun → her sabah tek dosya</text>

<!-- Kaynaklar -->
<rect x="40" y="100" width="200" height="150" rx="14" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text x="140" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Kaynaklar</text>
<g font-size="12" fill="#444441">
<rect x="56" y="140" width="168" height="22" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/><text x="140" y="155" text-anchor="middle">LinkedIn · CV · site</text>
<rect x="56" y="168" width="168" height="22" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/><text x="140" y="183" text-anchor="middle">Kod, belge, iş kayıtları</text>
<rect x="56" y="196" width="168" height="22" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/><text x="140" y="211" text-anchor="middle">AI sohbet geçmişleri</text>
<rect x="56" y="224" width="168" height="18" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/><text x="140" y="237" text-anchor="middle">Senin anlatımın (sesli olur)</text>
</g>

<!-- Sorular -->
<rect x="40" y="270" width="200" height="110" rx="14" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text x="140" y="296" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Sorular (küme küme)</text>
<g font-size="12" fill="#444441" text-anchor="middle">
<text x="140" y="320">geçmiş · bir haftan</text>
<text x="140" y="340">enerji ve çekince</text>
<text x="140" y="360">5 yıl resmi · "yeter" ne</text>
</g>

<!-- Ajan -->
<rect x="300" y="160" width="190" height="150" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="395" y="190" text-anchor="middle" font-size="15" font-weight="600" fill="#26215C">Ajan</text>
<text x="395" y="210" text-anchor="middle" font-size="12" fill="#3C3489">AGENTS.md'yi okur</text>
<g font-size="12" fill="#534AB7" text-anchor="middle">
<text x="395" y="240">1 · ne anladığını söyler</text>
<text x="395" y="258">2 · kanıt toplar, ad koyar</text>
<text x="395" y="276">3 · klasörü kurar</text>
<text x="395" y="294">4 · her gün yazar</text>
</g>

<!-- arrows into agent -->
<path d="M240 175 L270 175 L270 215 L298 215" fill="none" stroke="#6B6A66" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M240 325 L270 325 L270 260 L298 260" fill="none" stroke="#6B6A66" stroke-width="1.5" marker-end="url(#ar)"/>

<!-- outputs -->
<g>
<rect x="560" y="100" width="190" height="56" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="655" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">01 · Ben kimim</text>
<text x="655" y="141" text-anchor="middle" font-size="12" fill="#0F6E56">gerçek geçmiş · becerilerin adı</text>

<rect x="560" y="172" width="190" height="56" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="655" y="194" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">02 · Yön</text>
<text x="655" y="213" text-anchor="middle" font-size="12" fill="#0F6E56">10 yıl · 3 yıl · 1 yıl · 90 gün</text>

<rect x="560" y="244" width="190" height="56" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="655" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">04 · Görünürlük</text>
<text x="655" y="285" text-anchor="middle" font-size="12" fill="#0F6E56">anlatım kalıpları · LinkedIn</text>

<rect x="560" y="316" width="190" height="56" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="655" y="338" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">05 · Sözlük</text>
<text x="655" y="357" text-anchor="middle" font-size="12" fill="#0F6E56">terimler · alanının rolleri</text>
</g>

<path d="M490 200 L525 200 L525 128 L558 128" fill="none" stroke="#6B6A66" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M490 220 L525 220 L525 200 L558 200" fill="none" stroke="#6B6A66" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M490 250 L525 250 L525 272 L558 272" fill="none" stroke="#6B6A66" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M490 270 L525 270 L525 344 L558 344" fill="none" stroke="#6B6A66" stroke-width="1.5" marker-end="url(#ar)"/>

<!-- BUGUN -->
<rect x="560" y="396" width="190" height="50" rx="12" fill="#534AB7" stroke="#3C3489" stroke-width="1"/>
<text x="655" y="417" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">BUGUN.md</text>
<text x="655" y="435" text-anchor="middle" font-size="12" fill="#CECBF6">her sabah tek dosya · 1,5 saat</text>

<path d="M655 372 L655 394" fill="none" stroke="#534AB7" stroke-width="1.8" marker-end="url(#arp)"/>

<!-- loop back -->
<path d="M560 421 L395 421 L395 312" fill="none" stroke="#534AB7" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arp)"/>
<text x="455" y="412" text-anchor="middle" font-size="12" fill="#534AB7">akşam "bitti" → ajan yarını yazar</text>

<g font-size="12" fill="#6B6A66" text-anchor="middle">
<rect x="40" y="396" width="200" height="54" rx="10" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="140" y="413">Ritim</text>
<text x="140" y="429">haftalık defter · 2 haftada taş</text>
<text x="140" y="444">90 günde yön yenilenir</text>
</g>
</svg>
